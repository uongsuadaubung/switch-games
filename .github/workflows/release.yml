name: Build & Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:   # Cho phép ấn nút "Run workflow" trên GitHub UI
  push:
    branches:
      - main           # Tự động chạy khi push code lên main
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cần để tạo release và push branch web
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compute Version (yyyy.mm.dd)
        id: get_version
        shell: bash
        run: |
          DATE_VER=$(date +'%Y.%m.%d')
          VERSION="v${DATE_VER}.${{ github.run_number }}"
          echo "Calculated Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          node scripts/bump-version.mjs "${DATE_VER}.${{ github.run_number }}"

      - name: Build Web & Neutralino App
        run: npm run neu:build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Create GitHub Release & Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ver="${{ steps.get_version.outputs.version }}"
          cp dist/switch-games/switch-games-win_x64.exe dist/switch-games-windows-x64.exe
          cp dist/switch-games/switch-games-linux_x64 dist/switch-games-linux-x64
          cp dist/switch-games/switch-games-mac_arm64 dist/switch-games-mac-arm64

          gh release create "$ver" \
            "dist/switch-games-windows-x64.exe#switch-games-windows-x64.exe" \
            "dist/switch-games-linux-x64#switch-games-linux-x64" \
            "dist/switch-games-mac-arm64#switch-games-mac-arm64" \
            --title "Release $ver" \
            --notes "Tự động phát hành phiên bản $ver"

      - name: Keep only 5 latest releases (Clean up old releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +6 | while read -r tag; do
            echo "🗑️ Đang xóa release cũ: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Deploy to branch web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./build
          force_orphan: true
          user_name: uongsuadaubung
          user_email: manhkien13041997@gmail.com
          commit_message: "🚀 Deploy web - ${{ steps.get_version.outputs.version }}"
